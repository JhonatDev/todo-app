AWSTemplateFormatVersion: "2010-09-09"
Description: Buckets privados e identidade GitHub Actions para a entrega PM-04
Parameters:
  GitHubRepository:
    Type: String
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
    Description: Proprietário/repositório, com a mesma grafia do GitHub
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Use false se o provedor token.actions.githubusercontent.com já existir na conta
Conditions:
  CreateProvider: !Equals [!Ref CreateOIDCProvider, "true"]
Resources:
  GitHubOIDC:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: backup-pm04-14-dias
            Status: Enabled
            ExpirationInDays: 14
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOIDC
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:environment:dev
                  - !Sub repo:${GitHubRepository}:environment:homolog
                  - !Sub repo:${GitHubRepository}:environment:prod
      Policies:
        - PolicyName: ProvisionAndOperatePM04
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageRegionalEC2
                Effect: Allow
                Action: ec2:*
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: ManageProjectInstanceRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListInstanceProfilesForRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/todo-app-*-ec2-ssm
              - Sid: ManageProjectInstanceProfile
                Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:UntagInstanceProfile
                  - iam:ListInstanceProfileTags
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/todo-app-*-ec2-ssm
              - Sid: PassOnlyProjectRolesToEC2
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/todo-app-*-ec2-ssm
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: AttachOnlySSMCore
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/todo-app-*-ec2-ssm
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
              - Sid: SSHToProjectInstances
                Effect: Allow
                Action: ssm:StartSession
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Project: todo-app
              - Sid: UseSSHSessionDocument
                Effect: Allow
                Action: ssm:StartSession
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartSSHSession
              - Sid: ManageSessionChannel
                Effect: Allow
                Action: [ssmmessages:OpenDataChannel, ssm:TerminateSession]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:session/*
              - Sid: ReadBucketMetadata
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: [!GetAtt StateBucket.Arn, !GetAtt BackupBucket.Arn]
              - Sid: StoreStateAndBackups
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub ${StateBucket.Arn}/pm04/*
                  - !Sub ${BackupBucket.Arn}/*
              - Sid: ReleaseStateLock
                Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub ${StateBucket.Arn}/pm04/*.tflock
Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
  StateBucketName:
    Value: !Ref StateBucket
  BackupBucketName:
    Value: !Ref BackupBucket
