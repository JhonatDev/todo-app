# Implantação na AWS — VM 1 (Aplicação: Nginx + Frontend React + API Express)
services:
  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io/seu-usuario}/todo-app-backend:${DOCKER_TAG:-1.0.0}
    restart: unless-stopped
    expose:
      - "${BACKEND_PORT:-5000}"
    networks:
      - app-net
    environment:
      PORT: ${BACKEND_PORT:-5000}
      MONGO_HOST: ${MONGO_PRIVATE_IP:?Defina o IP privado da VM do MongoDB}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DB: ${MONGO_DB:-todo-app}
      MONGO_USER: ${MONGO_APP_USER:?Defina MONGO_APP_USER no ambiente}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD:?Defina MONGO_APP_PASSWORD no ambiente}
      MONGO_AUTH_SOURCE: ${MONGO_DB:-todo-app}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const port=process.env.PORT||5000;http.get('http://127.0.0.1:'+port+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io/seu-usuario}/todo-app-frontend:${DOCKER_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1:8080}:80"
    networks:
      - app-net
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-5000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-net:
    driver: bridge

