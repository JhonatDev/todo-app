# Implantação na AWS — VM 2 (Banco de Dados exclusivo: MongoDB)
# Não publica a porta 27017 na internet: vincula apenas ao IP privado da VM na VPC.
services:
  mongo:
    image: ${DOCKER_REGISTRY:-ghcr.io/seu-usuario}/todo-app-mongo:${DOCKER_TAG:-1.0.0}
    build:
      context: ../banco-de-dados
    container_name: mongo-todo
    restart: unless-stopped
    ports:
      - "${MONGO_PRIVATE_IP:?Defina o IP privado da VM de banco para bind}:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Defina MONGO_INITDB_ROOT_USERNAME no ambiente}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Defina MONGO_INITDB_ROOT_PASSWORD no ambiente}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-todo-app}
      MONGO_APP_USER: ${MONGO_APP_USER:?Defina MONGO_APP_USER no ambiente}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Defina MONGO_APP_PASSWORD no ambiente}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:

