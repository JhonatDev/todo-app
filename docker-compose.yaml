# Ambiente local do ToDo App (Nginx + React + Express + MongoDB)
services:
  mongo:
    build:
      context: ./banco-de-dados
    image: todo-app-mongo:${IMAGE_TAG:-1.0.0}
    container_name: mongo-todo
    restart: unless-stopped
    networks:
      - todo-net
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Defina MONGO_INITDB_ROOT_USERNAME no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Defina MONGO_INITDB_ROOT_PASSWORD no .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-todo-app}
      MONGO_APP_USER: ${MONGO_APP_USER:?Defina MONGO_APP_USER no .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Defina MONGO_APP_PASSWORD no .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: todo-app-backend:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    expose:
      - "${BACKEND_PORT:-5000}"
    networks:
      - todo-net
    environment:
      PORT: ${BACKEND_PORT:-5000}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-todo-app}
      MONGO_USER: ${MONGO_APP_USER:?Defina MONGO_APP_USER no .env}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD:?Defina MONGO_APP_PASSWORD no .env}
      MONGO_AUTH_SOURCE: ${MONGO_DB:-todo-app}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const port=process.env.PORT||5000;http.get('http://127.0.0.1:'+port+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
    image: todo-app-frontend:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - todo-net
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-5000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:

networks:
  todo-net:
    driver: bridge
